[project]
name = "milmap"
version = "0.1.0"
description = "Mildata -> Milmap: ingest, extract, fuse and export war-map data by day"
requires-python = ">=3.13"
dependencies = [
  "anthropic>=1.12",
  "duckdb>=1.5.6",
  "feedparser>=6.0.14",
  "httpx>=0.28.1",
  "orjson>=3.13",
  "pydantic>=2.13",
  "pyproj>=3.8",
  "pyyaml>=6.0",
  "rapidfuzz>=3.14",
  "selectolax>=1.0",
  "shapely>=2.2",
  "telethon>=1.45",
  "tenacity>=9.2",
  "typer>=0.27",
  "unidecode>=1.4",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "mypy>=2.4"]

[project.scripts]
milmap = "milmap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milmap"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
